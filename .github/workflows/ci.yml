name: ci

on:
  push:
  pull_request:

jobs:
  cliff-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the suite
        uses: actions/checkout@v4
        with:
          path: cliff-test

      # The suite is defined against the other two repositories: the fixtures and
      # the token benchmark import the reference implementation, and the
      # specification examples are checked in place in the sibling cliff checkout.
      # Without them whole suites would collect nothing, and a suite that collects
      # nothing passes for the wrong reason - which is why the test step sets
      # CLIFF_REQUIRE_SIBLINGS below instead of letting pytest skip.
      - name: Check out the specification
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: ${{ github.repository_owner }}/cliff
          path: cliff

      - name: Check out the reference implementation
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: ${{ github.repository_owner }}/cliff-python
          path: cliff-python

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        working-directory: cliff-test
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The conformance fixtures and the token benchmark, each suite checked in
      # the mode it is about (strict, layout, style, tolerant).
      - name: Conformance fixtures and token benchmark
        working-directory: cliff-test
        run: python tests/run_all.py

      # `run_all.py` rewrites the token-benchmark report and its nine fixtures; this is
      # what notices when the committed copy and the generator have drifted apart. It is
      # the counterpart of cliff-python's `regenerate_examples.py --check`, and the same
      # step sits in `make check` so the local gate and this one cannot disagree.
      - name: Generated artefacts match their generator
        working-directory: cliff-test
        run: python tools/token_benchmark.py --check

      # The specification repository's own check, run against the sibling checkout that
      # was made above: its examples and its document-style fences are the artefact this
      # suite is defined against. The `if:` mirrors `continue-on-error` on that checkout,
      # so a failed spec checkout is reported by the test step rather than here.
      - name: Specification examples and fences
        if: hashFiles('cliff/tools/check_examples.py') != ''
        working-directory: cliff-test
        run: python ../cliff/tools/check_examples.py

      # The corpus is the instrument, so its version line and its gold digests are
      # guarded rather than trusted.
      - name: Corpus version and provenance guard
        working-directory: cliff-test
        run: python tools/corpus_version.py

      - name: Lint
        working-directory: cliff-test
        run: ruff check .

      - name: Test
        working-directory: cliff-test
        env:
          CLIFF_REQUIRE_SIBLINGS: ${{ hashFiles('cliff/spec/**') != '' && '1' || '0' }}
        run: pytest

      # The harness's own end-to-end gate: offline, no model calls, and the only
      # check that exercises the CLI, the pipeline and the scoring chain together.
      - name: Offline end-to-end self-check
        working-directory: cliff-test
        run: python -m clarion selfcheck

      # The credential scan is a gate the project runs by hand before a push; here
      # it runs on every push instead, so a key pasted into a test cannot reach a
      # commit unnoticed.
      - name: Credential scan
        working-directory: cliff-test
        run: python -m clarion secret-scan

      # The two batteries the runner only runs on request, and the reason they are here:
      # `docs/acceptance-criteria.md` cites them as acceptance checks, and they were
      # reachable only by hand. The make target generates what they read (the 100 edits
      # are gitignored, the stored quality translation is removed by `make clean`), so
      # the same target a developer runs is the one CI runs.
      - name: Quality constraints and edit robustness
        working-directory: cliff-test
        run: make quality robustness
