name: ci

on:
  push:
  pull_request:

jobs:
  clif-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Conformance fixtures and token benchmark
        run: python tests/run_all.py
