[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cliff-clarion"
version = "0.1.0"
description = "CLARION - Contextual Localization Accuracy, Robustness, Instruction-following and Overhead beNchmark for the CLIFF format"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "CLIFF contributors" }]
keywords = ["localization", "benchmark", "cliff", "translation", "evaluation", "llm"]
dependencies = []

[project.optional-dependencies]
# Deterministic token accounting (dimensions 1 and 2). Without tiktoken the
# harness falls back to a documented heuristic tokenizer and labels it as such.
tokens = ["tiktoken>=0.7"]
# YAML corpora, YAML run configuration and the YAML format arms.
yaml = ["PyYAML>=6.0"]
# HTTP providers (OpenAI-compatible endpoints such as DeepSeek).
providers = ["httpx>=0.27"]
# Optional neural quality metrics. COMET model weights carry their own
# licenses; several are CC-BY-NC. See datasets/clarion-core/DATA-LICENSES.md.
neural = ["unbabel-comet>=2.2"]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
    "mypy>=1.8",
    "PyYAML>=6.0",
    "tiktoken>=0.7",
    "httpx>=0.27",
]

[project.scripts]
clarion = "clarion.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["clarion*"]

[tool.pytest.ini_options]
# The whole test tree, not just tests/clarion: with `testpaths = ["tests/clarion"]`
# a bare `pytest` silently never collected `tests/test_validator_tool.py` or
# `tests/test_edit_robustness.py` - eleven tests that existed and did not run.
# Only files matching pytest's `test_*.py` pattern are collected, so the helper
# scripts beside them (`tests/quality/check_constraints.py`,
# `tests/edit-robustness/apply_edits.py`) stay out of the suite.
testpaths = ["tests"]
# The harness runs under a file sandbox that only allows writes inside the
# workspace, so pytest's temporary root and cache are kept in the repository.
# Note what actually fails there, measured rather than assumed: every
# `tempfile`-based mechanism is denied, and the denial is a `PermissionError:
# [WinError 5]` raised by `tempfile`'s own permission reset (`_resetperms` ->
# `os.chmod`) while it creates or removes a directory under the session temporary
# root. `tmp_path` fails that way, and so does `tmp_path_factory.mktemp(...)`; a
# test that merely *requests* `tmp_path_factory` without calling `mktemp` never
# creates a directory and therefore passes, which is not evidence that the
# factory works. Tests that need scratch space write it inside `tests/clarion/_*/`
# and remove it afterwards, and `.gitignore` covers those names; `conftest.py`
# does the same for its fixture corpus.
addopts = "-q -p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# `readme_lines` is one list literal whose every element is a line of the README
# this script ships inside a benchmark bundle. Wrapping it would obscure which
# bytes are published, which is the one thing the file has to get exactly right, so
# the line stays as it is and the length rule is waived for this file alone.
"tools/package_benchmark.py" = ["E501"]
# The 100-edit task table: one dict per edit, each carrying the natural-language
# instruction that is the instrument. The instructions are the data under test, and
# wrapping them would make the table unreadable without changing a byte of it.
"tests/edit-robustness/apply_edits.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["clarion"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[project.urls]
Repository = "https://github.com/cliff-format/cliff-test"
Issues = "https://github.com/cliff-format/cliff-test/issues"
