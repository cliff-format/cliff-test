[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clif-clarion"
version = "0.1.0"
description = "CLARION - Contextual Localization Accuracy, Robustness, Instruction-following and Overhead beNchmark for the CLIF format"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "CLIF contributors" }]
keywords = ["localization", "benchmark", "clif", "translation", "evaluation", "llm"]
dependencies = []

[project.optional-dependencies]
# Deterministic token accounting (dimensions 1 and 2). Without tiktoken the
# harness falls back to a documented heuristic tokenizer and labels it as such.
tokens = ["tiktoken>=0.7"]
# YAML corpora, YAML run configuration and the YAML format arms.
yaml = ["PyYAML>=6.0"]
# HTTP providers (OpenAI-compatible endpoints such as DeepSeek).
providers = ["httpx>=0.27"]
# Optional neural quality metrics. COMET model weights carry their own
# licenses; several are CC-BY-NC. See datasets/clarion-core/DATA-LICENSES.md.
neural = ["unbabel-comet>=2.2"]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
    "mypy>=1.8",
    "PyYAML>=6.0",
    "tiktoken>=0.7",
    "httpx>=0.27",
]

[project.scripts]
clarion = "clarion.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["clarion*"]

[tool.pytest.ini_options]
testpaths = ["tests/clarion"]
# The harness runs under a file sandbox that only allows writes inside the
# workspace, so pytest's temporary root and cache are kept in the repository.
addopts = "-q -p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["clarion"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
