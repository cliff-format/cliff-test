[[groups.dialog-act3-first-meet.entries]]
id = "ask-origin"
source = "你从哪里来？"
target = "Where do you come from?"
type = "dialogue"
emotion = ["polite", "curious"]
status = "reviewed"

[[groups.dialog-act3-first-meet.entries]]
id = "ask-companion"
source = "{name}，{gender, select, male {他} female {她} other {他们}} 是你的同伴吗？"
target = "{name}, is {gender, select, male {he} female {she} other {they}} your companion?"
